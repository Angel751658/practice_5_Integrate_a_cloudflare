name: Build, Test and Deploy Prod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, unit tests and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Add coverage table to workflow summary
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { relative, sep } from 'node:path';

          const coverage = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const percent = (metric) =>
            typeof metric.pct === 'number' ? `${metric.pct.toFixed(1)}%` : metric.pct;
          const rows = Object.entries(coverage)
            .map(([file, metrics]) => {
              const name =
                file === 'total' ? '**All files**' : relative(process.cwd(), file).split(sep).join('/');
              return `| ${name} | ${percent(metrics.statements)} | ${percent(metrics.branches)} | ${percent(metrics.functions)} | ${percent(metrics.lines)} |`;
            })
            .join('\n');

          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Coverage report\n\n| File | % Stmts | % Branch | % Funcs | % Lines |\n| --- | ---: | ---: | ---: | ---: |\n${rows}\n`,
          );
          NODE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: dist
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error

  deploy-prod:
    name: Deploy Cloudflare Prod
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers (Prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.API_KEY }}
          accountId: ${{ secrets.ACCOUNT_ID }}
          command: deploy --env production
